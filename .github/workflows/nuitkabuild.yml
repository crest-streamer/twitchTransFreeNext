name: Build TwitchTransFN

on:
  push:
    tags:
      - "cv*"

jobs:
  build:
    strategy:
      matrix:
        env: [linux, windows, macos_M1, macos_Intel]
        include:
          - env: linux
            os: ubuntu-latest
            bin: twitchTransFN.bin
            archive: tar.gz
            target: linux
          - env: windows
            os: windows-latest
            bin: twitchTransFN_win.exe
            archive: zip
            target: win
          - env: macos_M1
            os: macos-latest
            bin: twitchTransFN.app
            archive: tar.gz
            arch: _arm64
            target: macos
          - env: macos_Intel
            os: macos-latest
            bin: twitchTransFN.app
            archive: tar.gz
            arch: _x86_64
            target: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -r requirements.txt

      - name: Install pyobjc (MacOS)
        if: matrix.os == 'macos-latest'
        run: pip install pyobjc

      - name: Download cacert.pem
        run: |
          curl -o cacert.pem https://curl.se/ca/cacert.pem
      
      - name: Install build tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install scons make

      - name: Build Icon for macOS
        if: matrix.os == 'macos-latest'
        run: |
          if [ ! -f icon.png ]; then
            echo "Error: icon.png not found."
            exit 1
          fi
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          cp icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset

      - name: Build binary
        run: |
          python build.py ${{ matrix.env }}
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twitchtransfn-${{ matrix.target }}-${{ matrix.arch || 'x86_64' }}
          path: |
            release/*

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
