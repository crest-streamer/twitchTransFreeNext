name: Build Binaries and Create Release

on:
  push:
    tags:
      - "cv*"

env:
  GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}

jobs:
  build:
    strategy:
      matrix:
        env: [linux, windows, macos_M1, macos_Intel]
        include:
          - env: linux
            os: ubuntu-latest
            bin: twitchTransFN
            archive: tar.gz
          - env: windows
            os: windows-latest
            bin: twitchTransFN.exe
            archive: zip
          - env: macos_M1
            os: macos-latest
            bin: twitchTransFN.command
            archive: tar.gz
            arch: _arm64
          - env: macos_Intel
            os: macos-latest
            bin: twitchTransFN.command
            archive: tar.gz
            arch: _x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install nuitka
          pip install -r requirements.txt
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            pip install imageio
          fi
        shell: bash

      - name: Download cacert.pem
        run: curl -o cacert.pem https://curl.se/ca/cacert.pem

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build with Nuitka
        shell: bash
        run: |
          ICON_OPT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON_OPT="--windows-icon-from-ico=icon.ico"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICON_OPT="--macos-app-icon=icon.ico"
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            ICON_OPT="--linux-icon=icon.ico"
          fi

          python -m nuitka --standalone --onefile --output-dir=dist \
            --follow-imports --remove-output --assume-yes-for-downloads \
            $ICON_OPT twitchTransFN.py

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep "version =" twitchTransFN.py | awk -F "'" '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Archive binaries
        run: |
          ARCHIVE_NAME="twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}"
          mv dist "$ARCHIVE_NAME"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -r "${ARCHIVE_NAME}.zip" "$ARCHIVE_NAME"
          else
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"
          fi

      # GPGのインポート処理
      - name: Import GPG Keys (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' && env.GPG_PRIVATE_KEY != '' && env.GPG_PUBLIC_KEY != '' }}
        shell: bash
        run: |
          echo "${{ env.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ env.GPG_PUBLIC_KEY }}" | gpg --batch --import

      - name: Import GPG Keys (Windows)
        if: ${{ matrix.os == 'windows-latest' && env.GPG_PRIVATE_KEY != '' && env.GPG_PUBLIC_KEY != '' }}
        shell: bash
        run: |
          echo "${{ env.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ env.GPG_PUBLIC_KEY }}" | gpg --batch --import

      - name: Import GPG Keys (macOS)
        if: ${{ matrix.os == 'macos-latest' && env.GPG_PRIVATE_KEY != '' && env.GPG_PUBLIC_KEY != '' }}
        shell: bash
        run: |
          echo "${{ env.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ env.GPG_PUBLIC_KEY }}" | gpg --batch --import

      # GPG署名処理
      - name: GPG Sign Binary
        if: ${{ env.GPG_PRIVATE_KEY != '' && env.GPG_PUBLIC_KEY != '' && env.GPG_PASSPHRASE != '' && env.GPG_KEY_ID != '' }}
        shell: bash
        run: |
          ARCHIVE_NAME="twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}"
          BIN_PATH="$ARCHIVE_NAME/${{ matrix.bin }}"
          echo "$GPG_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$GPG_KEY_ID" \
              --output "$BIN_PATH.sig" \
              --detach-sign "$BIN_PATH"

      - name: Archive binaries with .sig
        run: |
          ARCHIVE_NAME="twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -r "${ARCHIVE_NAME}.zip" "$ARCHIVE_NAME"
          else
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"
          fi

      # リリースのアップロード
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}.${{ matrix.archive }}
            twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}.${{ matrix.archive }}.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        run: |
          rm -rf twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}
