name: Build TwitchTransFN

on:
  push:
    tags:
      - "cv*"

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos_M1
            arch: arm64
          - os: macos-latest
            target: macos_Intel
            arch: x86_64
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -r requirements.txt

      - name: Install pyobjc
        if: matrix.os == 'macos-latest'
        run: | 
          pip install pyobjc

      - name: Build Icon for macOS
        if: matrix.os == 'macos-latest'
        run: |
          if [ ! -f icon.png ]; then
            echo "Error: icon.png not found. Please provide an icon.png file."
            exit 1
          fi
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          cp icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset
          echo "macOS icon built successfully"

      - name: Build for ${{ matrix.target }}
        run: |
          python build.py ${{ matrix.target }}
          echo "Build completed for ${{ matrix.target }}"
        env:
          VERSION: ${{ github.ref_name }}  # バージョン情報を環境変数に設定

      - name: Set up GPG
        if: env.GPG_PRIVATE_KEY != '' && env.GPG_KEY_ID != '' && env.GPG_PASSPHRASE != ''  # キーがブランクでない場合のみ実行
        run: |
          echo "Setting up GPG..."
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes
          echo "${{ secrets.GPG_PUBLIC_KEY }}" | gpg --import --batch --yes
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          gpg-agent --daemon
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign Artifacts with GPG
        if: env.GPG_PRIVATE_KEY != '' && env.GPG_KEY_ID != '' && env.GPG_PASSPHRASE != ''  # キーがブランクでない場合のみ実行
        run: |
          for file in dist/*; do
            if [ -f "$file" ]; then
              echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --pinentry-mode loopback --passphrase-fd 0 --sign --armor --output "${file}.asc" --detach-sign --default-key "${{ secrets.GPG_KEY_ID }}" "$file"
              echo "Signed: ${file}.asc"
            fi
          done
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Skip GPG Signing (if keys are blank)
        if: env.GPG_PRIVATE_KEY == '' || env.GPG_KEY_ID == '' || env.GPG_PASSPHRASE == ''
        run: |
          echo "GPG keys are blank. Skipping GPG signing."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4  # v3 から v4 にアップデート
        with:
          name: twitchtransfn-${{ matrix.target }}-${{ matrix.arch || 'x86_64' }}
          path: |
            dist/*
            dist/*.asc

      - name: Create Release (on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            dist/twitchTransFN_*_*.exe
            dist/twitchTransFN_*_*.command
            dist/twitchTransFN_*_linux
            dist/*.asc
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        id: get_version
        run: |
          echo "VERSION=$(python -c 'from build import get_version; print(get_version())')" >> $GITHUB_ENV
          echo "Version set to: ${{ env.VERSION }}"
