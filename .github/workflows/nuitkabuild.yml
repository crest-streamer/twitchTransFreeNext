name: build binaries

on:
  push:
    tags:
      - "cv*"

jobs:
  build_matrix:
    strategy:
      matrix:
        env: [linux, windows, macos_M1, macos_Intel]
        include:
          - env: linux
            os: ubuntu-latest
            bin: twitchTransFN
            archive: tar.gz
          - env: windows
            os: windows-latest
            bin: twitchTransFN.exe
            archive: zip
          - env: macos_M1
            os: macos-latest
            bin: twitchTransFN.command
            archive: tar.gz
            arch: _arm64
          - env: macos_Intel
            os: macos-latest
            bin: twitchTransFN.command
            archive: tar.gz
            arch: _x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Upgrade pip and install dependencies
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install build-essential (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update && sudo apt install -y build-essential

      - name: Install dependencies for Nuitka (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt install -y ccache
            sudo apt-get install -y patchelf
          else
            brew install ccache
          fi
          python -m pip install nuitka

      - name: Install Nuitka for Windows
        if: matrix.os == 'windows-latest'
        run: python -m pip install nuitka

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Download cacert.pem
        run: curl -o cacert.pem https://curl.se/ca/cacert.pem

      - name: Get Version (for Linux)
        if: matrix.os == 'ubuntu-latest'
        id: get_version_linux
        run: |
          VERSION=$(grep "version =" twitchTransFN.py | awk -F "'" '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get Version (for Windows)
        if: matrix.os == 'windows-latest'
        id: get_version_windows
        run: |
          $VERSION = (Select-String -Pattern "version =" twitchTransFN.py).Line -replace ".*'([^']+)'.*", '$1'
          Write-Output "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get Version (for macOS)
        if: matrix.os == 'macos-latest'
        id: get_version_macos
        run: |
          VERSION=$(grep "version =" twitchTransFN.py | awk -F "'" '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Icon for macOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          cp icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build with Nuitka (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          nuitka --standalone --onefile --follow-imports \
            --output-dir=dist \
            --disable-cache=ccache \
            --output-filename=${{ matrix.bin }} \
            twitchTransFN.py \
            $(if [[ "${{ matrix.env }}" == "windows" ]]; then echo "--windows-icon-from-ico=icon.ico"; elif [[ "${{ matrix.env }}" == "linux" ]]; then echo "--linux-icon=icon.ico"; else echo "--macos-app-icon=icon.icns --macos-create-app-bundle"; fi)


      - name: Build with Nuitka (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          nuitka `
            --standalone `
            --onefile `
            --follow-imports `
            --output-dir=dist `
            --disable-cache=ccache `
            --output-filename=${{ matrix.bin }} `
            --windows-icon-from-ico=icon.ico `
            twitchTransFN.py


      - name: Build with Nuitka for macOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          COMMON_ARGS="--standalone --onefile --follow-imports --output-dir=dist --output-filename=${{ matrix.bin }}"
          nuitka $COMMON_ARGS --macos-app-icon=icon.icns --macos-create-app-bundle twitchTransFN.py

      - name: Archive Binary (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}"
          $envName = "${{ matrix.env }}"
          $archiveName = "twitchTransFN_${version}_${envName}"
          $sourcePath = "dist/${{ matrix.bin }}"
          $extension = [System.IO.Path]::GetExtension($sourcePath)
          $targetPath = "dist/${archiveName}${extension}"
          if (-Not (Test-Path $sourcePath)) {
            Write-Error "File $sourcePath not found"
            exit 1
          }
          Rename-Item -Path $sourcePath -NewName $targetPath
          if (Test-Path "${archiveName}.zip") {
            Remove-Item "${archiveName}.zip"
          }
          Compress-Archive -Path $targetPath -DestinationPath "${archiveName}.zip"


      - name: Archive Binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          ARCHIVE_NAME="twitchTransFN_${{ env.VERSION }}_${{ matrix.env }}"
          mkdir "$ARCHIVE_NAME"
          mv "dist/${{ matrix.bin }}" "$ARCHIVE_NAME/"

          # 不要なフォルダを削除
          rm -rf "$ARCHIVE_NAME/twitchTransFN.build"
          rm -rf "$ARCHIVE_NAME/twitchTransFN.onefile-build"
          rm -rf "$ARCHIVE_NAME/twitchTransFN.dist"
          rm -rf "$ARCHIVE_NAME/Resources"

          tar -czvf "$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"



      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            twitchTransFN_${{ env.VERSION }}_${{ matrix.env }}.${{ matrix.archive }}
            dist/${{ matrix.bin }}.asc

      - name: Clean up (Windows)
        if: matrix.os == 'windows-latest'
        run: Remove-Item -Recurse -Force dist, *.tar.gz, *.zip, *.asc -ErrorAction SilentlyContinue

      - name: Clean up (Unix)
        if: matrix.os != 'windows-latest'
        run: rm -rf dist *.tar.gz *.zip *.asc || true


