name: Build Binaries and Create Release

on:
  push:
    tags:
      - "cv*"

env:
  GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - env: linux_ubuntu
            os: ubuntu-latest
            image: ubuntu:22.04
            bin: twitchTransFN
            archive: tar.gz
            platform: native
          - env: linux_centos7
            os: ubuntu-latest
            image: centos:7
            bin: twitchTransFN
            archive: tar.gz
            platform: docker
          - env: windows
            os: windows-latest
            bin: twitchTransFN.exe
            archive: zip
            platform: native
          - env: macos_M1
            os: macos-latest
            bin: twitchTransFN.command
            archive: tar.gz
            arch: arm64
            platform: native
          - env: macos_Intel
            os: macos-latest
            bin: twitchTransFN.command
            archive: tar.gz
            arch: x86_64
            platform: native

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install nuitka -r requirements.txt

      - name: Convert .ico to .icns on macOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          cp icon.png           icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Download cacert.pem
        run: curl -o cacert.pem https://curl.se/ca/cacert.pem

      - name: Create dist directory
        run: mkdir -p dist

      - name: Install patchelf (CentOS/Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' || matrix.os == 'centos-latest' }}
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y patchelf
          elif [[ "${{ matrix.os }}" == "centos-latest" ]]; then
            sudo yum --disablerepo=base update
            sudo yum install -y patchelf
          fi

      - name: Build in Docker (Linux CentOS7)
        if: ${{ matrix.platform == 'docker' }}
        run: |
          docker run --rm -v "$PWD":/work -w /work ${{ matrix.image }} bash -c '
            yum install -y epel-release && \
            yum install -y python3 python3-pip gcc gcc-c++ make python3-devel curl && \
            pip3 install --upgrade pip setuptools wheel && \
            pip3 install nuitka -r requirements.txt && \
            python3 -m nuitka --standalone --onefile --output-dir=dist \
              --follow-imports --linux-icon=icon.ico --remove-output \
              --assume-yes-for-downloads twitchTransFN.py'

      - name: Build natively (Windows/Linux/macOS)
        if: ${{ matrix.platform == 'native' }}
        shell: bash
        run: |
          ICON_OPT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON_OPT="--windows-icon-from-ico=icon.ico"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICON_OPT="--macos-app-icon=icon.icns"
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            ICON_OPT="--linux-icon=icon.ico"
          fi

          BUILD_CMD="python -m nuitka --standalone --onefile --output-dir=dist \
            --follow-imports --remove-output --assume-yes-for-downloads \
            $ICON_OPT twitchTransFN.py"

          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            arch -${{ matrix.arch }} bash -c "$BUILD_CMD"
          else
            eval "$BUILD_CMD"
          fi

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep -oP "version\s*=\s*['\"]\K[0-9\.]+(?=['\"])" twitchTransFN.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare archive folder
        run: |
          ARCHIVE_NAME="twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}"
          mkdir -p "$ARCHIVE_NAME"
          mv dist/${{ matrix.bin }} "$ARCHIVE_NAME/"

      - name: Import GPG Keys
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PUBLIC_KEY" | gpg --batch --import

      - name: GPG Sign Binary
        if: ${{ env.GPG_PRIVATE_KEY != '' && env.GPG_KEY_ID != '' }}
        run: |
          ARCHIVE_NAME="twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}"
          BIN_PATH="$ARCHIVE_NAME/${{ matrix.bin }}"
          echo "$GPG_PASSPHRASE" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$GPG_KEY_ID" \
              --output "$BIN_PATH.sig" \
              --detach-sign "$BIN_PATH"
          mv "$BIN_PATH.sig" "$ARCHIVE_NAME/"

      - name: Final archive with .sig
        run: |
          ARCHIVE_NAME="twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -r "${ARCHIVE_NAME}.zip" "$ARCHIVE_NAME"
          else
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            twitchTransFN_${{ steps.get_version.outputs.version }}_${{ matrix.env }}.${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        run: rm -rf twitchTransFN_*
