name: build binaries

on:
  push:
    tags:
      - "cv*"

jobs:
  build_matrix:
    strategy:
      matrix:
        env: [linux, windows, macos_M1, macos_Intel]
        include:
          - env: linux
            os: ubuntu-latest
            bin: twitchTransFN
            archive: tar.gz
          - env: windows
            os: windows-latest
            bin: twitchTransFN.exe
            archive: zip
          - env: macos_M1
            os: macos-latest
            bin: twitchTransFN.command
            archive: tar.gz
            arch: _arm64
          - env: macos_Intel
            os: macos-latest
            bin: twitchTransFN.command
            archive: tar.gz
            arch: _x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Upgrade pip and install dependencies
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies for Nuitka (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y patchelf
          fi
          python -m pip install nuitka

      - name: Install Nuitka for Windows
        if: matrix.os == 'windows-latest'
        run: python -m pip install nuitka

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Download cacert.pem
        run: curl -o cacert.pem https://curl.se/ca/cacert.pem

      - name: Get Version (for Linux)
        if: matrix.os == 'ubuntu-latest'
        id: get_version_linux
        run: |
          VERSION=$(grep "version =" twitchTransFN.py | awk -F "'" '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get Version (for Windows)
        if: matrix.os == 'windows-latest'
        id: get_version_windows
        run: |
          $VERSION = (Select-String -Pattern "version =" twitchTransFN.py).Line -replace ".*'([^']+)'.*", '$1'
          Write-Output "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get Version (for macOS)
        if: matrix.os == 'macos-latest'
        id: get_version_macos
        run: |
          VERSION=$(grep "version =" twitchTransFN.py | awk -F "'" '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build with Nuitka for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          COMMON_ARGS="--standalone --onefile --follow-imports --output-dir=dist --output-filename=${{ matrix.bin }}"
          nuitka $COMMON_ARGS --linux-icon=icon.ico twitchTransFN.py

      - name: Build with Nuitka for Windows
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist
          COMMON_ARGS="--standalone --onefile --follow-imports --output-dir=dist --output-filename=${{ matrix.bin }}"
          nuitka $COMMON_ARGS --windows-icon-from-ico=icon.ico twitchTransFN.py

      - name: Build with Nuitka for macOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          COMMON_ARGS="--standalone --onefile --follow-imports --output-dir=dist --output-filename=${{ matrix.bin }}"
          nuitka $COMMON_ARGS --macos-app-icon=icon.icns --macos-create-app-bundle twitchTransFN.py

      - name: Sign the binary with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" -ab dist/${{ matrix.bin }}

      - name: Archive Binary (zip)
        if: matrix.archive == 'zip'
        run: powershell Compress-Archive -Path dist/* -DestinationPath twitchTransFN_${{ env.VERSION }}_${{ matrix.env }}.zip

      - name: Archive Binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          ARCHIVE_NAME="twitchTransFN_${{ env.VERSION }}_${{ matrix.env }}"
          mv dist "$ARCHIVE_NAME"
          tar -czvf "$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            twitchTransFN_${{ env.VERSION }}_${{ matrix.env }}.${{ matrix.archive }}
            dist/${{ matrix.bin }}.asc

      - name: Clean up
        run: rm -rf dist *.tar.gz *.zip *.asc || true
